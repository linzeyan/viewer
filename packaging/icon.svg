<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: an 824px squircle centred on a 1024 canvas.
       scripts/make-icons.sh crops the margin away for Windows. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <circle cx="664" cy="352" r="88" fill="#FDE68A"/>
    <path d="M40 960 L372 486 Q396 452 420 486 L752 960 Z" fill="url(#far)"/>
    <path d="M300 960 L566 586 Q590 552 614 586 L1000 960 Z" fill="url(#near)"/>
  </g>
</svg>
